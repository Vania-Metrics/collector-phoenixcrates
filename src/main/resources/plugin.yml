# PhoenixCrates metrics — crates, keys, and above all whether the odds hold up.
#
# The real reward distribution can't be read anywhere in-game. Compared to
# the configured weights, it shows up here: a reward advertised at 2% that
# actually lands at 0.5% is one query away.
#
# "depend" is not possible, and it's not an oversight. The plugin is named
# PhoenixCratesLite in the free edition and PhoenixCrates in the paid one —
# that name is literally what decides the edition on the plugin's side. A
# "depend" on either would get this jar rejected by Bukkit wherever the other
# is installed. "softdepend" only guarantees load ORDER, not presence: that's
# why CratesPaper checks for it itself, the same way the spark module does
# for a related reason.
name: VaniaMetrics-Crates
version: ${version}
main: fr.samflix.vaniametrics.module.phoenixcrates.CratesPaper
api-version: '1.21'
authors: [mc-vania]
description: "PhoenixCrates metrics: opens, rewards drawn, key stock."
depend: [VaniaMetrics]
softdepend: [PhoenixCratesLite, PhoenixCrates]
folia-supported: true
